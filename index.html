<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--tx:#1b1b1a;--mu:#76766f;--ac:#e8590c;--ln:#e2e2db;--ok:#2f9e44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--card:#1d1d1b;--tx:#f1f1ec;--mu:#9a9a92;--ln:#2e2e2b}}
:root[data-theme="dark"]{--bg:#121211;--card:#1d1d1b;--tx:#f1f1ec;--mu:#9a9a92;--ln:#2e2e2b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{padding:14px 14px 150px;max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ln);color:var(--tx)}
button.p{background:var(--ac);color:#fff;font-weight:600}
button.d{background:transparent;color:#d6336c}
button.w{width:100%}button.on{background:var(--ac);color:#fff}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.scroll button{white-space:nowrap;padding:8px 12px}
input{font:inherit;width:100%;padding:9px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);min-width:0}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.set b{color:var(--mu);text-align:center}
.chk{padding:10px 0;text-align:center}.chk.on{background:var(--ok);color:#fff}
.set.done input{opacity:.55}
.big{font-size:26px;font-weight:700}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:var(--ac);border-radius:5px 5px 0 0;min-height:2px;margin-bottom:3px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;border-radius:0;background:none;padding:14px 0;color:var(--mu);font-size:13px}
#tabs button.on{color:var(--ac);font-weight:700}
#rest{position:fixed;left:10px;right:10px;bottom:calc(56px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border-radius:14px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;gap:8px}
#rest button{background:rgba(255,255,255,.25);color:#fff;padding:8px 10px}
#rest .t{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
textarea{width:100%;height:90px;font-size:11px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:9px}
details summary{cursor:pointer}
</style></head><body>
<div id="app"></div>
<div id="rest"><div><div class="mu" style="color:#fff">Recupero</div><span class="t" id="rt">0:00</span></div><div class="row"><button data-a="r+">+15s</button><button data-a="rx">Salta</button></div></div>
<div id="tabs"></div>
<script>
const LIB={
Petto:['Panca inclinata Smith','Croci inclinata manubri','Push-up diamante','Panca piana bilanciere','Panca inclinata bilanciere','Panca declinata','Panca piana manubri','Panca inclinata manubri','Croci manubri','Croci ai cavi','Pec deck','Chest press','Cavi alti-bassi','Piegamenti','Dip alle parallele','Pullover manubrio'],
Schiena:['Rack pull','Meadows row','Trazioni presa neutra','Superman','Trazioni alla sbarra','Lat machine presa larga','Lat machine presa stretta','Lat machine presa inversa','Rematore bilanciere','Rematore manubrio','Rematore al cavo basso','Rematore T-bar','Pulley','Pulldown braccia tese','Low row machine','Hyperextension','Stacco da terra','Shrug manubri','Shrug bilanciere'],
Spalle:['Alzate laterali macchina','Upright row','Landmine press','Military press','Shoulder press manubri','Shoulder press machine','Alzate laterali manubri','Alzate laterali ai cavi','Alzate frontali','Alzate posteriori manubri','Reverse pec deck','Face pull','Arnold press','Tirate al mento'],
Bicipiti:['Curl ai cavi alto','Spider curl','Curl inverso','Curl 21','Curl bilanciere','Curl manubri','Curl a martello','Curl panca Scott','Curl ai cavi','Curl concentrato','Curl panca inclinata','Curl EZ'],
Tricipiti:['Skull crusher','Dip alla panca','JM press','French press','Pushdown ai cavi','Pushdown con corda','Estensioni sopra la testa','Panca presa stretta','Dip tricipiti','Kickback','Estensioni al cavo a una mano'],
Gambe:['Sissy squat','Nordic curl','Stacco sumo','Pistol squat','Pendulum squat','Leg press orizzontale','Squat bilanciere','Front squat','Squat Smith','Hack squat','Leg press','Affondi','Affondi camminati','Split squat bulgaro','Leg extension','Leg curl sdraiato','Leg curl seduto','Stacco rumeno','Stacco a gambe tese','Goblet squat','Step-up','Abductor machine','Adductor machine'],
Glutei:['Hip abduction al cavo','Frog pump','Pull-through al cavo','Hip thrust','Glute bridge','Glute kickback al cavo','Good morning'],
Polpacci:['Donkey calf','Calf in piedi','Calf seduto','Calf alla leg press'],
Addome:['Sit-up','Crunch su panca declinata','Crunch bicicletta','Mountain climber','Hollow hold','V-up','Woodchop al cavo','Dragon flag','Toes to bar','Pallof press','Knee raise alla sbarra','Plank dinamico','Crunch','Crunch ai cavi','Plank','Sollevamento gambe alla sbarra','Leg raise','Russian twist','Ab wheel','Crunch inverso','Side plank'],
Avambracci:['Wrist curl','Wrist curl inverso'],
Cardio:['Tapis roulant (camminata)','Corsa sul tapis','Camminata inclinata','Cyclette','Spinning','Air bike','Ellittica','Vogatore','Stairmaster','Step aerobico','Salto con la corda','Burpees','Jumping jack','Battle rope','Sled push']};
const FL=[];for(const g in LIB)LIB[g].forEach(n=>FL.push({n,g}));
const grp=n=>(FL.find(x=>x.n.toLowerCase()==n.toLowerCase())||{g:'Altro'}).g;
const uid=()=>Math.random().toString(36).slice(2,9);
let S={plans:[],logs:[],active:null};
try{const d=localStorage.getItem('gym');if(d)S=Object.assign(S,JSON.parse(d))}catch(x){}
S.plans.forEach(p=>{if(!p.days){p.days=[{id:uid(),name:'Giorno 1',ex:p.ex||[]}];delete p.ex}});
const save=()=>{try{localStorage.setItem('gym',JSON.stringify(S))}catch(x){}};
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let view='plans',editing=null,ed=0,pick=null,armed=null,summ=null,wk=0,bk='',timer={end:0,t:null};
const $=id=>document.getElementById(id);
const volOf=l=>l.ex.reduce((t,x)=>t+x.sets.reduce((u,s)=>u+s.kg*s.reps,0),0);
const nf=n=>Math.round(n).toLocaleString('it-IT');
const fmt=d=>new Date(d).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});

const ST=[30,14,30,20,30,38,30,30,30,40,30,48,30,58];
const P={std:[0,ST,ST],
incline:[1,[8,25,14,29,36,40,20,21,22,12,48,34,50,56],[8,25,14,29,36,40,24,33,17,25,48,34,50,56],'<path d="M6 32L36 44M30 46h14"/>'],
latpull:[1,[22,15,23,21,24,44,26,12,30,3,40,44,42,58],[22,15,23,21,24,44,22,32,32,24,40,44,42,58],'<rect x="14" y="46" width="18" height="4"/><path d="M22 3h16"/>'],
rowc:[1,[20,20,20,26,18,46,30,34,42,38,34,42,46,52],[20,20,20,26,18,46,16,36,28,38,34,42,46,52],'<rect x="8" y="48" width="18" height="4"/><path d="M44 38h14"/>'],
squat:[1,[30,14,30,20,30,38,34,28,38,22,30,48,30,58],[37,26,34,32,20,44,38,36,42,31,38,46,32,58]],
lunge:[1,ST,[32,16,32,22,30,40,34,32,34,40,46,44,48,58]],
deadlift:[1,[46,26,40,30,18,36,40,40,38,52,26,46,26,58],ST],
row:[1,[46,24,40,28,16,34,40,38,40,48,18,46,18,58],[46,24,40,28,16,34,32,32,36,38,18,46,18,58]],
pullup:[0,[32,18,30,24,30,42,30,15,30,6,30,50,30,58],[32,5,30,11,30,29,38,18,30,6,34,38,28,48],'<path d="M10 6h40"/>'],
ohpress:[1,[30,14,30,20,30,38,36,28,32,20,30,48,30,58],[30,14,30,20,30,38,33,12,31,2,30,48,30,58]],
raise:[1,ST,[30,14,30,20,30,38,38,24,46,24,30,48,30,58]],
curl:[1,ST,[30,14,30,20,30,38,30,30,38,22,30,48,30,58]],
tri:[1,[30,14,30,20,30,38,32,30,40,22,30,48,30,58],[30,14,30,20,30,38,32,30,34,42,30,48,30,58],'<path d="M38 0l2 22"/>'],
press:[1,[8,36,14,36,38,36,14,26,14,16,48,32,50,52],[8,36,14,36,38,36,22,40,14,32,48,32,50,52],'<rect x="2" y="40" width="42" height="4"/>'],
pushup:[0,[8,18,12,22,36,30,12,34,12,46,46,38,57,46],[6,32,12,35,36,38,18,42,12,46,46,42,57,46]],
plank:[0,[6,28,12,31,36,35,12,44,22,46,46,40,57,46],[6,28,12,31,36,36,12,44,22,46,46,41,57,46]],
crunch:[0,[8,50,13,50,34,50,12,42,9,47,44,38,50,50],[12,40,17,43,34,50,16,34,10,38,44,38,50,50]],
legraise:[0,[8,50,13,50,34,50,20,50,26,51,44,50,54,50],[8,50,13,50,34,50,20,50,26,51,34,40,34,28]],
hipthrust:[1,[8,36,14,38,34,50,24,44,30,48,46,38,50,56],[8,36,14,38,34,38,24,44,30,38,46,38,48,56],'<rect x="2" y="40" width="18" height="14"/>'],
legpress:[0,[6,36,11,40,18,48,16,46,22,46,34,40,44,52],[6,36,11,40,18,48,16,46,22,46,36,38,52,30],'<path d="M2 52l20-8"/>'],
legext:[0,[14,12,14,18,16,38,18,28,26,34,32,38,32,54],[14,12,14,18,16,38,18,28,26,34,32,38,48,38],'<rect x="6" y="40" width="22" height="4"/>'],
legcurl:[0,[6,38,12,40,32,40,14,46,20,48,46,40,58,40],[6,38,12,40,32,40,14,46,20,48,46,40,44,22],'<rect x="2" y="43" width="48" height="4"/>'],
calf:[1,ST,[30,10,30,16,30,34,30,26,30,36,30,44,30,58]],
twist:[1,[20,29,24,34,30,48,32,40,40,38,42,40,48,50],[20,29,24,34,30,48,30,42,20,40,42,40,48,50]],
bike:[0,[32,12,30,18,24,36,38,26,44,30,38,42,32,54],[32,12,30,18,24,36,38,26,44,30,40,36,44,48],'<path d="M14 38h12M44 28v4"/>'],
run:[0,[30,10,30,16,28,34,36,26,40,32,40,38,34,48],[30,10,30,16,28,34,22,26,18,32,22,44,14,50]],
stairs:[0,[30,10,30,16,30,34,36,26,40,32,38,42,40,48],[30,10,30,16,30,34,24,26,20,32,30,44,30,56],'<rect x="34" y="50" width="16" height="6"/>'],
rower:[0,[26,24,28,30,24,46,36,36,46,40,40,36,34,50],[20,28,22,34,24,46,24,40,30,36,44,44,52,52],'<path d="M4 54h54"/>'],
rope:[0,ST,[30,8,30,14,30,32,30,24,30,34,30,42,30,52],'<path d="M14 34Q30 74 46 34"/>','<path d="M14 34Q30 -6 46 34"/>']};
const RX=[[/leg raise|sollevamento gambe|toes to bar|knee raise|v-up|hollow|dragon/i,'legraise'],[/crunch|sit-up/i,'crunch'],[/plank|ab wheel|climber/i,'plank'],[/russian|twist|woodchop|pallof/i,'twist'],[/leg press|pendulum/i,'legpress'],[/leg extension|abduct|adduct/i,'legext'],[/leg curl|nordic/i,'legcurl'],[/curl/i,'curl'],[/hip thrust|bridge|glute|frog/i,'hipthrust'],[/panca inclinata|croci inclinata/i,'incline'],[/reverse|face pull/i,'raise'],[/panca|croci|chest press|pec deck|cavi alti|pullover/i,'press'],[/piegamenti|dip|push-up/i,'pushup'],[/pushdown|french|skull|estensioni|kickback|tricip|jm press/i,'tri'],[/lat machine|pulldown/i,'latpull'],[/pulley|low row|rematore al cavo|seated row/i,'rowc'],[/trazioni/i,'pullup'],[/rematore|pulley|low row|t-bar|meadows|superman/i,'row'],[/military|shoulder press|arnold|landmine/i,'ohpress'],[/alzate|tirate|upright/i,'raise'],[/stairmaster|step|scala/i,'stairs'],[/affondi|split|lunge|pistol/i,'lunge'],[/squat|hack|goblet/i,'squat'],[/stacco|deadlift|good morning|hyperext|rack pull|pull-through/i,'deadlift'],[/calf|donkey|shrug/i,'calf'],[/cyclette|spinning|bike/i,'bike'],[/tapis|corsa|camminata|ellittica|sled/i,'run'],[/vogatore/i,'rower'],[/corda|burpee|jumping/i,'rope']];
const pat=n=>{for(const[r,k]of RX)if(r.test(n))return k;return'std'};
const g=(p,i)=>p[2*i]+','+p[2*i+1];
const J=a=>a.split(',').map(Number);
function fig(n,s){const q=P[pat(n)]||P.std,A=q[1];return `<svg class="an" viewBox="0 0 60 60" width="${s}" height="${s}" style="flex:none" aria-hidden="true" data-a="${q[1]}" data-b="${q[2]}"><path d="M2 58h56" style="stroke:var(--ln);stroke-width:2;fill:none"/><g class="xa" style="stroke:var(--ac);stroke-width:2.5;fill:none;stroke-linecap:round">${q[3]||''}</g><g class="xb" style="stroke:var(--ac);stroke-width:2.5;fill:none;stroke-linecap:round;display:none">${q[4]||''}</g><g style="stroke:var(--tx);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round"><polyline points="${g(A,1)} ${g(A,2)}"/><polyline points="${g(A,1)} ${g(A,3)} ${g(A,4)}"/><polyline points="${g(A,2)} ${g(A,5)} ${g(A,6)}"/></g><circle class="h" cx="${A[0]}" cy="${A[1]}" r="4.5" style="fill:var(--card);stroke:var(--tx);stroke-width:3"/>${q[0]?`<circle class="wt" cx="${A[8]}" cy="${A[9]}" r="3.5" style="fill:var(--ac)"/>`:''}</svg>`}
let lastT=0;
function loop(t){requestAnimationFrame(loop);if(t-lastT<40)return;lastT=t;
  const k=(1-Math.cos(t/1100*Math.PI))/2;
  document.querySelectorAll('svg.an').forEach(s=>{
    if(!s.e){s.A=J(s.dataset.a);s.B=J(s.dataset.b);s.e={pl:s.querySelectorAll('polyline'),h:s.querySelector('.h'),w:s.querySelector('.wt'),xa:s.querySelector('.xa'),xb:s.querySelector('.xb')}}
    const p=s.A.map((v,i)=>v+(s.B[i]-v)*k),e=s.e;
    e.pl[0].setAttribute('points',g(p,1)+' '+g(p,2));e.pl[1].setAttribute('points',g(p,1)+' '+g(p,3)+' '+g(p,4));e.pl[2].setAttribute('points',g(p,2)+' '+g(p,5)+' '+g(p,6));
    e.h.setAttribute('cx',p[0]);e.h.setAttribute('cy',p[1]);
    if(e.w){e.w.setAttribute('cx',p[8]);e.w.setAttribute('cy',p[9])}
    if(e.xb.firstChild){const b=k>.5;e.xa.style.display=b?'none':'';e.xb.style.display=b?'':'none'}
  })}
requestAnimationFrame(loop);
function render(){
  $('tabs').innerHTML=[['plans','Schede'],['work','Allenamento'],['hist','Storico'],['week','Settimana']].map(([k,l])=>`<button class="${view==k?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('');
  $('app').innerHTML=view=='plans'?vPlans():view=='work'?vWork():view=='hist'?vHist():vWeek();
}
function sample(){const D=(n,l)=>({id:uid(),name:n,ex:l.map(([a,s,r,t])=>({id:uid(),name:a,sets:s,reps:r,rest:t,kg:0}))});
return{id:uid(),name:'Esempio 3 giorni',days:[
D('Giorno 1 · Petto, spalle, bicipiti',[['Panca piana bilanciere',4,8,120],['Panca inclinata manubri',3,10,90],['Croci ai cavi',3,12,60],['Shoulder press manubri',3,10,90],['Alzate laterali manubri',3,15,45],['Curl bilanciere',3,10,60],['Curl a martello',3,12,60],['Crunch ai cavi',3,15,45],['Sollevamento gambe alla sbarra',3,12,45],['Cyclette',1,20,0]]),
D('Giorno 2 · Dorso, tricipiti, spalle',[['Trazioni alla sbarra',4,8,120],['Rematore bilanciere',4,8,90],['Lat machine presa stretta',3,10,75],['Rematore al cavo basso',3,12,60],['Pushdown ai cavi',3,12,60],['French press',3,10,60],['Alzate posteriori manubri',3,15,45],['Face pull',3,15,45],['Camminata inclinata',1,20,0],['Plank',3,45,45],['Russian twist',3,20,45]]),
D('Giorno 3 · Gambe + spalle, dorso, petto',[['Squat bilanciere',4,8,120],['Leg press',3,12,90],['Stacco rumeno',3,10,90],['Leg curl sdraiato',3,12,60],['Leg extension',3,12,60],['Calf in piedi',4,15,45],['Shoulder press machine',3,12,75],['Lat machine presa larga',3,12,75],['Chest press',3,12,75],['Ab wheel',3,10,45],['Crunch inverso',3,15,45],['Ellittica',1,15,0]])]}}
function newEx(n){return{id:uid(),name:n||'',sets:3,reps:10,rest:90,kg:0}}
function plist(){const q=pick.q.toLowerCase();return FL.filter(x=>(pick.g=='Tutti'||x.g==pick.g)&&x.n.toLowerCase().includes(q)).map(x=>`<div class="card row sp" style="padding:10px;margin-bottom:6px" data-a="pickEx" data-n="${e(x.n)}">${fig(x.n,72)}<span style="flex:1">${e(x.n)}<br><span class="mu">${x.g}</span></span></div>`).join('')}
function vPlans(){
  if(pick)return `<h1>Libreria esercizi</h1><div class="row"><input id="pq" data-f="q" placeholder="Cerca esercizio…" value="${e(pick.q)}"></div>
  <div class="scroll" style="margin-top:8px">${['Tutti',...Object.keys(LIB)].map(g=>`<button class="${pick.g==g?'on':''}" data-a="pg" data-g="${g}">${g}</button>`).join('')}</div>
  <div class="row sp" style="margin-bottom:8px"><button data-a="pickCustom">+ Crea personalizzato</button><button class="p" data-a="pickDone">Fatto (<span id="pc">${pick.n}</span>)</button></div><div id="pl">${plist()}</div>`;
  if(editing){const p=editing,d=p.days[ed];return `<h1>${p.isNew?'Nuova scheda':'Modifica scheda'}</h1>
  <div class="card"><label>Nome scheda</label><input data-f="pname" value="${e(p.name)}" placeholder="es. Push Pull Legs"></div>
  <div class="scroll">${p.days.map((x,i)=>`<button class="${i==ed?'on':''}" data-a="selDay" data-i="${i}">${e(x.name)}</button>`).join('')}<button data-a="addDay">+ Giorno</button></div>
  <div class="card"><div class="row"><div style="flex:1"><label>Nome giorno</label><input data-f="dname" value="${e(d.name)}"></div>${p.days.length>1?`<button class="d" data-a="delDay">Elimina giorno</button>`:''}</div></div>
  ${d.ex.map((x,i)=>`<div class="card"><div class="row">${fig(x.name,72)}<b style="flex:1">${e(x.name)}</b><button data-a="mvEx" data-i="${i}">↑</button><button class="d" data-a="delEx" data-i="${i}">✕</button></div>
  <div class="g4">${[['sets','Serie'],['reps','Rip.'],['kg','Kg'],['rest','Pausa s']].map(([k,l])=>`<div><label>${l}</label><input type="number" inputmode="decimal" data-f="ex" data-i="${i}" data-k="${k}" value="${x[k]}"></div>`).join('')}</div></div>`).join('')||'<p class="mu">Nessun esercizio in questo giorno.</p>'}
  <button class="w p" data-a="openPick">+ Aggiungi esercizi</button>
  <div class="row" style="margin-top:12px"><button data-a="cancelEdit">Annulla</button><button class="p w" data-a="savePlan">Salva scheda</button></div>`}
  return `<h1>Le mie schede</h1>
  ${S.plans.map(p=>`<div class="card"><h2>${e(p.name)}</h2>${p.days.map(d=>`<div style="border-top:1px solid var(--ln);padding:8px 0"><div class="row sp"><b>${e(d.name)}</b><button class="p" data-a="start" data-id="${p.id}" data-d="${d.id}">Avvia</button></div><div class="mu">${d.ex.map(x=>`${e(x.name)} · ${x.sets}×${x.reps}${x.kg?' @'+x.kg+'kg':''} · pausa ${x.rest}s`).join('<br>')||'Vuoto'}</div></div>`).join('')}
  <div class="row" style="margin-top:6px"><button data-a="editPlan" data-id="${p.id}">Modifica</button><button class="d" data-a="delPlan" data-id="${p.id}">${armed=='p'+p.id?'Conferma?':'Elimina'}</button></div></div>`).join('')||'<p class="mu">Nessuna scheda. Creane una per iniziare.</p>'}
  <button class="w" style="margin-bottom:8px" data-a="sample">Carica scheda di esempio (3 giorni)</button><button class="p w" data-a="newPlan">+ Nuova scheda</button>`;
}
function last(name){for(let i=S.logs.length-1;i>=0;i--){const x=S.logs[i].ex.find(x=>x.name.toLowerCase()==name.toLowerCase());if(x)return x.sets}return null}
function vWork(){
  const a=S.active;
  if(!a)return `<h1>Allenamento</h1>${summ?`<div class="card"><h2>Allenamento completato 💪</h2><div class="stats"><div><div class="big">${nf(summ.vol)} kg</div><div class="mu">carico spostato</div></div><div><div class="big">${summ.min} min</div><div class="mu">durata</div></div><div><div class="big">${summ.sets}</div><div class="mu">serie</div></div><div><div class="big">${summ.reps}</div><div class="mu">ripetizioni</div></div></div><button class="w" style="margin-top:10px" data-a="closeSum">Chiudi</button></div>`:''}
  ${S.plans.map(p=>`<div class="card"><h2>${e(p.name)}</h2>${p.days.map(d=>`<button class="w" style="margin-bottom:6px" data-a="start" data-id="${p.id}" data-d="${d.id}">${e(d.name)}</button>`).join('')}</div>`).join('')||'<p class="mu">Prima crea una scheda.</p>'}`;
  return `<h1>${e(a.name)}</h1>${a.ex.map((x,i)=>{const l=last(x.name);return `<div class="card"><h2>${e(x.name)}</h2><div style="text-align:center">${fig(x.name,170)}</div><div class="mu">Pausa ${x.rest}s${l?' · ultima volta: '+l.map(s=>s.kg+'×'+s.reps).join(', '):''}</div>
  ${x.sets.map((s,j)=>`<div class="set ${s.done?'done':''}"><b>${j+1}</b><input type="number" inputmode="decimal" data-f="w" data-i="${i}" data-j="${j}" data-k="kg" value="${s.kg}" placeholder="kg"><input type="number" inputmode="numeric" data-f="w" data-i="${i}" data-j="${j}" data-k="reps" value="${s.reps}" placeholder="rip"><button class="chk ${s.done?'on':''}" data-a="chk" data-i="${i}" data-j="${j}">✓</button></div>`).join('')}
  <div class="row"><button data-a="addSet" data-i="${i}">+ Serie</button><button class="d" data-a="delSet" data-i="${i}">− Serie</button></div></div>`}).join('')}
  <div class="row"><button class="d" data-a="cancelW">${armed=='cw'?'Conferma?':'Annulla'}</button><button class="p w" data-a="finish">Termina allenamento</button></div>`;
}
function vHist(){
  return `<h1>Storico</h1>${[...S.logs].reverse().map(l=>`<div class="card"><details><summary><b>${e(l.name)}</b> <span class="mu">${fmt(l.date)} · ${l.min} min · ${nf(volOf(l))} kg</span></summary>
  <div style="margin-top:8px">${l.ex.map(x=>`<div><b>${e(x.name)}</b><div class="mu">${x.sets.map(s=>s.kg+'kg×'+s.reps).join(' · ')}</div></div>`).join('')}</div>
  <button class="d" data-a="delLog" data-id="${l.id}">${armed=='l'+l.id?'Conferma?':'Elimina'}</button></details></div>`).join('')||'<p class="mu">Ancora nessun allenamento.</p>'}
  <div class="card"><h2>Backup</h2><p class="mu">Genera il testo e conservalo. Per ripristinare incollalo e premi Ripristina.</p><textarea id="bk">${e(bk)}</textarea><div class="row" style="margin-top:8px"><button data-a="bkGen">Genera</button><button data-a="bkRes">Ripristina</button></div></div>`;
}
function wkOf(off){const m=new Date();m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7)+off*7);const n=new Date(m);n.setDate(n.getDate()+7);return{m,n,logs:S.logs.filter(l=>l.date>=m&&l.date<n)}}
function vWeek(){
  const w=wkOf(wk),p=wkOf(wk-1),vol=w.logs.reduce((t,l)=>t+volOf(l),0),pv=p.logs.reduce((t,l)=>t+volOf(l),0);
  const sets=w.logs.reduce((t,l)=>t+l.ex.reduce((u,x)=>u+x.sets.length,0),0),min=w.logs.reduce((t,l)=>t+l.min,0);
  const dv=[0,0,0,0,0,0,0],gv={};
  w.logs.forEach(l=>{dv[(new Date(l.date).getDay()+6)%7]+=volOf(l);l.ex.forEach(x=>{gv[grp(x.name)]=(gv[grp(x.name)]||0)+x.sets.reduce((u,s)=>u+s.kg*s.reps,0)})});
  const mx=Math.max(...dv,1),end=new Date(w.n-864e5),f=d=>d.toLocaleDateString('it-IT',{day:'numeric',month:'short'});
  const delta=pv>0?`${vol>=pv?'▲':'▼'} ${Math.abs(Math.round((vol-pv)/pv*100))}% vs settimana prec.`:'';
  return `<h1>Riepilogo settimanale</h1><div class="row sp" style="margin-bottom:10px"><button data-a="wk" data-n="-1">←</button><b>${f(w.m)} – ${f(end)}</b><button data-a="wk" data-n="1" ${wk>=0?'disabled style="opacity:.3"':''}>→</button></div>
  <div class="card"><div class="stats"><div><div class="big">${w.logs.length}</div><div class="mu">allenamenti</div></div><div><div class="big">${nf(vol)} kg</div><div class="mu">carico spostato</div></div><div><div class="big">${min} min</div><div class="mu">tempo in palestra</div></div><div><div class="big">${sets}</div><div class="mu">serie</div></div></div><div class="mu" style="margin-top:8px">${delta}</div></div>
  <div class="card"><h2>Carico per giorno</h2><div class="bars">${['L','M','M','G','V','S','D'].map((d,i)=>`<div><i style="height:${dv[i]/mx*85}px"></i>${d}</div>`).join('')}</div></div>
  <div class="card"><h2>Per gruppo muscolare</h2>${Object.entries(gv).sort((a,b)=>b[1]-a[1]).map(([g,v])=>`<div class="row sp"><span>${g}</span><b>${nf(v)} kg</b></div>`).join('')||'<span class="mu">Nessun dato.</span>'}</div>
  <div class="card"><h2>Sedute</h2>${w.logs.map(l=>`<div class="row sp"><span>${fmt(l.date)} · ${e(l.name)}</span><span class="mu">${l.min} min</span></div>`).join('')||'<span class="mu">Nessuna seduta.</span>'}</div>`;
}
function tick(){const r=Math.round((timer.end-Date.now())/1000);if(r<=0){stopT();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(x){}beep();return}$('rt').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0')}
function startT(s){clearInterval(timer.t);timer.end=Date.now()+s*1000;$('rest').style.display='flex';tick();timer.t=setInterval(tick,500)}
function stopT(){clearInterval(timer.t);$('rest').style.display='none'}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();o.stop(c.currentTime+.4)}catch(x){}}
const ask=k=>{if(armed==k){armed=null;return true}armed=k;render();return false};
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j,id=b.dataset.id;
  if(!['delPlan','cancelW','delLog'].includes(a))armed=null;
  if(a=='tab'){view=b.dataset.v;armed=null;editing=null;pick=null}
  else if(a=='sample'){S.plans.push(sample());save()}
  else if(a=='newPlan'){editing={id:uid(),name:'',days:[{id:uid(),name:'Giorno 1',ex:[]}],isNew:true};ed=0}
  else if(a=='editPlan'){editing=JSON.parse(JSON.stringify(S.plans.find(p=>p.id==id)));ed=0}
  else if(a=='selDay')ed=i;
  else if(a=='addDay'){editing.days.push({id:uid(),name:'Giorno '+(editing.days.length+1),ex:[]});ed=editing.days.length-1}
  else if(a=='delDay'){editing.days.splice(ed,1);ed=0}
  else if(a=='delEx')editing.days[ed].ex.splice(i,1);
  else if(a=='mvEx'&&i>0){const x=editing.days[ed].ex;[x[i-1],x[i]]=[x[i],x[i-1]]}
  else if(a=='openPick')pick={q:'',g:'Tutti',n:0};
  else if(a=='pg'){pick.g=b.dataset.g}
  else if(a=='pickEx'){editing.days[ed].ex.push(newEx(b.dataset.n));pick.n++;$('pc').textContent=pick.n;return}
  else if(a=='pickCustom'){if(!pick.q.trim())return;editing.days[ed].ex.push(newEx(pick.q.trim()));pick.n++;pick.q='';}
  else if(a=='pickDone')pick=null;
  else if(a=='cancelEdit')editing=null;
  else if(a=='savePlan'){if(!editing.name.trim())editing.name='Scheda';editing.days.forEach(d=>d.ex=d.ex.filter(x=>x.name.trim()));const p=JSON.parse(JSON.stringify(editing));delete p.isNew;const k=S.plans.findIndex(x=>x.id==p.id);k<0?S.plans.push(p):S.plans[k]=p;editing=null;save()}
  else if(a=='delPlan'){if(!ask('p'+id))return;S.plans=S.plans.filter(p=>p.id!=id);save()}
  else if(a=='start'){const p=S.plans.find(p=>p.id==id),d=p.days.find(x=>x.id==b.dataset.d);if(!d.ex.length)return;summ=null;S.active={name:p.name+' · '+d.name,t0:Date.now(),ex:d.ex.map(x=>{const l=last(x.name);return{name:x.name,rest:x.rest,sets:Array.from({length:x.sets},(_,k)=>({kg:l&&l[k]?l[k].kg:x.kg,reps:l&&l[k]?l[k].reps:x.reps,done:false}))}})};view='work';save()}
  else if(a=='chk'){const s=S.active.ex[i].sets[j];s.done=!s.done;if(s.done)startT(S.active.ex[i].rest);else stopT();save()}
  else if(a=='addSet'){const s=S.active.ex[i].sets;const l=s[s.length-1]||{kg:0,reps:10};s.push({kg:l.kg,reps:l.reps,done:false});save()}
  else if(a=='delSet'){S.active.ex[i].sets.pop();save()}
  else if(a=='cancelW'){if(!ask('cw'))return;S.active=null;stopT();save()}
  else if(a=='finish'){const A=S.active;const ex=A.ex.map(x=>({name:x.name,sets:x.sets.filter(s=>s.done).map(s=>({kg:+s.kg||0,reps:+s.reps||0}))})).filter(x=>x.sets.length);if(ex.length){const l={id:uid(),date:Date.now(),name:A.name,min:Math.max(1,Math.round((Date.now()-A.t0)/60000)),ex};S.logs.push(l);summ={vol:volOf(l),min:l.min,sets:ex.reduce((t,x)=>t+x.sets.length,0),reps:ex.reduce((t,x)=>t+x.sets.reduce((u,s)=>u+s.reps,0),0)}}S.active=null;stopT();save()}
  else if(a=='closeSum')summ=null;
  else if(a=='delLog'){if(!ask('l'+id))return;S.logs=S.logs.filter(l=>l.id!=id);save()}
  else if(a=='wk'){wk=Math.min(0,wk+ +b.dataset.n)}
  else if(a=='bkGen'){bk=JSON.stringify({plans:S.plans,logs:S.logs})}
  else if(a=='bkRes'){try{const d=JSON.parse($('bk').value);if(d.plans&&d.logs){S.plans=d.plans;S.logs=d.logs;S.plans.forEach(p=>{if(!p.days){p.days=[{id:uid(),name:'Giorno 1',ex:p.ex||[]}];delete p.ex}});save();bk='Ripristinato!'}}catch(x){bk='Backup non valido'}}
  else if(a=='r+'){timer.end+=15000;tick();return}
  else if(a=='rx'){stopT();return}
  render();
});
document.addEventListener('input',ev=>{
  const t=ev.target,f=t.dataset.f;if(!f)return;
  if(f=='pname')editing.name=t.value;
  else if(f=='dname')editing.days[ed].name=t.value;
  else if(f=='q'){pick.q=t.value;$('pl').innerHTML=plist()}
  else if(f=='ex')editing.days[ed].ex[+t.dataset.i][t.dataset.k]=+t.value;
  else if(f=='w'){S.active.ex[+t.dataset.i].sets[+t.dataset.j][t.dataset.k]=t.value;save()}
});
render();
</script></body></html>
